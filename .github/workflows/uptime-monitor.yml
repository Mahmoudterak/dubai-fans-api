name: Uptime Monitor (Secondary)

# SECONDARY backup check only.
#
# Primary monitoring: BetterStack Uptime (https://uptime.betterstack.com)
#   - Monitor: https://mtuaefans.com/api/healthz
#   - Interval: 1 minute  |  Timeout: 30 s  |  Alert: any non-200 response
#
# This workflow serves as a fallback because GitHub Actions enforces a minimum
# 5-minute cron interval. It still catches prolonged outages and provides a
# second independent signal. Keep it in place; do not rely on it as primary.
#
# Target: Cloudflare Worker at mtuaefans.com/api/*

on:
  schedule:
    # Every 5 minutes (GitHub Actions minimum granularity)
    - cron: '*/5 * * * *'
  # Allow a manual trigger to test the check immediately
  workflow_dispatch:

jobs:
  health-check:
    name: Ping /api/healthz (secondary)
    runs-on: ubuntu-latest

    steps:
      - name: Check https://mtuaefans.com/api/healthz
        run: |
          set -euo pipefail

          URL="https://mtuaefans.com/api/healthz"
          TIMEOUT=30   # seconds

          echo "Checking $URL (timeout: ${TIMEOUT}s)"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --max-time "$TIMEOUT" \
            --write-out "%{http_code}" \
            --output /tmp/health_body \
            "$URL")

          BODY=$(cat /tmp/health_body)
          echo "HTTP status : $HTTP_STATUS"
          echo "Response body: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Health check FAILED — expected 200, got $HTTP_STATUS"
            exit 1
          fi

          echo "Health check passed."
