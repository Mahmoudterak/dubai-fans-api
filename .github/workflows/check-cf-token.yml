name: Cloudflare Token Health Check

# Runs every Monday at 08:00 UTC so a stale/expired token is caught well
# before the next manual deploy attempt.
#
# What it does:
#   1. Calls `wrangler whoami` with the production CLOUDFLARE_API_TOKEN.
#   2. Fails the workflow (and sends a GitHub notification) if the token is
#      invalid or expired.
#
# When this fails:
#   - Check the token expiry in the Cloudflare dashboard:
#     https://dash.cloudflare.com/profile/api-tokens
#   - Renew / recreate the token (see README — "Cloudflare Token Runbook").
#   - Update the CLOUDFLARE_API_TOKEN GitHub Actions secret with the new value.

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  # Allow manual trigger to test immediately
  workflow_dispatch:

jobs:
  token-check:
    name: Verify Cloudflare API token is valid
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Check token via wrangler whoami
        run: |
          set -euo pipefail

          echo "Running: wrangler whoami"
          OUTPUT=$(wrangler whoami 2>&1)
          EXIT_CODE=$?

          echo "$OUTPUT"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::wrangler whoami failed — the Cloudflare API token may be expired or invalid."
            echo "::error::Renew the token at https://dash.cloudflare.com/profile/api-tokens and update the CLOUDFLARE_API_TOKEN GitHub Actions secret."
            exit 1
          fi

          # Extra guard: wrangler exits 0 but prints an auth error in some versions
          if echo "$OUTPUT" | grep -qi "authentication\|not authenticated\|unauthorized\|error"; then
            echo "::error::wrangler whoami returned an auth error in its output — token may be expired."
            echo "::error::Output: $OUTPUT"
            echo "::error::Renew the token at https://dash.cloudflare.com/profile/api-tokens and update the CLOUDFLARE_API_TOKEN GitHub Actions secret."
            exit 1
          fi

          echo "Token is valid."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Send alert email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          to: ${{ secrets.ADMIN_EMAIL }}
          from: ${{ secrets.SMTP_USER }}
          subject: "🚨 Cloudflare API token check FAILED — action required"
          body: |
            The weekly Cloudflare API token health check has FAILED.

            This means the CLOUDFLARE_API_TOKEN used by GitHub Actions is
            expired, revoked, or otherwise invalid. Deploys will fail until
            this is resolved.

            ── What to do ──────────────────────────────────────────────────

            1. Go to Cloudflare Dashboard → My Profile → API Tokens:
               https://dash.cloudflare.com/profile/api-tokens

            2. Find the token named "dubai-fans-worker-deploy" (or similar).
               Click Roll (or Edit to set expiry to "No expiration").

            3. Copy the new token value.

            4. In GitHub → Settings → Secrets → Actions, update the secret:
               CLOUDFLARE_API_TOKEN = <new value>

            5. Re-run the Cloudflare Token Health Check workflow manually to
               confirm it passes before the next deploy:
               https://github.com/${{ github.repository }}/actions/workflows/check-cf-token.yml

            ── Full runbook ────────────────────────────────────────────────

            See the "Cloudflare Token Runbook" section in the repository README:
            https://github.com/${{ github.repository }}/blob/main/README.md#cloudflare-token-runbook

            ── Workflow run ────────────────────────────────────────────────

            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
