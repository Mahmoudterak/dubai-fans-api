name: Cloudflare Token Health Check

# Runs every Monday at 08:00 UTC so a stale/expired token is caught well
# before the next manual deploy attempt.
#
# What it does:
#   1. Calls `wrangler whoami` with the production CLOUDFLARE_API_TOKEN.
#   2. Fails the workflow (and sends a GitHub notification) if the token is
#      invalid or expired.
#   3. On failure, sends an alert email via Resend API to ADMIN_EMAIL.
#
# Required GitHub Actions secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token to validate
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#   RESEND_API_KEY        — Resend API key for sending alert emails
#   ADMIN_EMAIL           — Recipient address for alert emails
#
# When this fails:
#   - Check the token expiry in the Cloudflare dashboard:
#     https://dash.cloudflare.com/profile/api-tokens
#   - Renew / recreate the token (see README — "Cloudflare Token Runbook").
#   - Update the CLOUDFLARE_API_TOKEN GitHub Actions secret with the new value.

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  # Allow manual trigger — set force_fail=true to test the alert email path
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Set to "true" to force a failure and test the alert email'
        required: false
        default: 'false'

jobs:
  token-check:
    name: Verify Cloudflare API token is valid
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler@latest

      # Test step: deliberate failure when force_fail=true (used to verify alert email)
      - name: Force failure (test mode only)
        if: ${{ github.event.inputs.force_fail == 'true' }}
        run: |
          echo "::error::FORCE_FAIL=true — this is a deliberate test failure to verify the alert email."
          exit 1

      - name: Check token via wrangler whoami
        run: |
          set -euo pipefail

          echo "Running: wrangler whoami"
          OUTPUT=$(wrangler whoami 2>&1)
          EXIT_CODE=$?

          echo "$OUTPUT"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::wrangler whoami failed — the Cloudflare API token may be expired or invalid."
            echo "::error::Renew the token at https://dash.cloudflare.com/profile/api-tokens and update the CLOUDFLARE_API_TOKEN GitHub Actions secret."
            exit 1
          fi

          # Extra guard: wrangler exits 0 but prints an auth error in some versions
          if echo "$OUTPUT" | grep -qi "authentication\|not authenticated\|unauthorized\|error"; then
            echo "::error::wrangler whoami returned an auth error in its output — token may be expired."
            echo "::error::Output: $OUTPUT"
            echo "::error::Renew the token at https://dash.cloudflare.com/profile/api-tokens and update the CLOUDFLARE_API_TOKEN GitHub Actions secret."
            exit 1
          fi

          echo "Token is valid."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Send alert email on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::warning::RESEND_API_KEY secret is not set — skipping alert email."
            exit 0
          fi

          if [ -z "${ADMIN_EMAIL:-}" ]; then
            echo "::warning::ADMIN_EMAIL secret is not set — skipping alert email."
            exit 0
          fi

          SUBJECT="🚨 Cloudflare API token check FAILED — action required"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          BODY_HTML="<div style='font-family:Arial,sans-serif;max-width:600px;'>
          <h2 style='color:#CC0000;'>🚨 Cloudflare API Token Check FAILED</h2>
          <p>The weekly Cloudflare API token health check has <strong>FAILED</strong>.</p>
          <p>This means the <code>CLOUDFLARE_API_TOKEN</code> used by GitHub Actions is
          expired, revoked, or otherwise invalid. Deploys will fail until this is resolved.</p>
          <hr/>
          <h3>What to do</h3>
          <ol>
            <li>Go to <a href='https://dash.cloudflare.com/profile/api-tokens'>Cloudflare Dashboard → My Profile → API Tokens</a></li>
            <li>Find the token named <strong>dubai-fans-worker-deploy</strong> (or similar).
                Click Roll (or Edit to set expiry to \"No expiration\").</li>
            <li>Copy the new token value.</li>
            <li>In <strong>GitHub → Settings → Secrets → Actions</strong>, update the secret:
                <code>CLOUDFLARE_API_TOKEN = &lt;new value&gt;</code></li>
            <li>Re-run the Cloudflare Token Health Check workflow manually to confirm it passes.</li>
          </ol>
          <hr/>
          <p><strong>Workflow run:</strong> <a href='${RUN_URL}'>${RUN_URL}</a></p>
          <p><strong>Repo:</strong> ${REPO}</p>
          </div>"

          HTTP_STATUS=$(curl --silent --show-error \
            --write-out "%{http_code}" \
            --output /tmp/resend_response.json \
            --request POST \
            --url "https://api.resend.com/emails" \
            --header "Authorization: Bearer ${RESEND_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{
              \"from\": \"Dubai Fans Alerts <alerts@mtuaefans.com>\",
              \"to\": [\"${ADMIN_EMAIL}\"],
              \"subject\": \"${SUBJECT}\",
              \"html\": $(echo "$BODY_HTML" | python3 -c 'import sys, json; print(json.dumps(sys.stdin.read()))')
            }")

          echo "Resend API response (HTTP ${HTTP_STATUS}):"
          cat /tmp/resend_response.json
          echo ""

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "::error::Alert email failed — Resend returned HTTP ${HTTP_STATUS}. Check RESEND_API_KEY and sender domain config."
            exit 1
          fi

          echo "Alert email sent successfully to ${ADMIN_EMAIL}."
