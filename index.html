<!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="60" />
    <title>Dubai Fans — Service Status</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 3rem 1.5rem; gap: 2rem; }
      .logo { font-size: 1.5rem; font-weight: 700; color: #f8fafc; }
      .logo span { color: #60a5fa; }
      .card { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 2rem; width: 100%; max-width: 620px; }
      .card-title { font-size: .75rem; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 1.25rem; }
      .status-row { display: flex; align-items: center; gap: .75rem; }
      .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
      .dot.ok  { background: #22c55e; box-shadow: 0 0 10px #22c55e88; }
      .dot.err { background: #ef4444; box-shadow: 0 0 10px #ef444488; }
      .dot.chk { background: #94a3b8; animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
      .status-label { font-size: 1.15rem; font-weight: 600; }
      .sub { margin-top: .5rem; font-size: .85rem; color: #94a3b8; padding-left: 1.625rem; }
      .history-grid { display: flex; gap: 3px; margin-top: 1rem; flex-wrap: wrap; }
      .bar { width: 12px; height: 32px; border-radius: 3px; background: #334155; cursor: default; }
      .bar.ok  { background: #22c55e; } .bar.err { background: #ef4444; }
      .legend { font-size: .75rem; color: #64748b; margin-top: .5rem; display: flex; justify-content: space-between; }
      .footer { font-size: .75rem; color: #64748b; text-align: center; }
      a { color: #60a5fa; text-decoration: none; }
    </style>
    </head>
    <body>
    <div class="logo">Dubai Fans <span>Status</span></div>
    <div class="card">
      <div class="card-title">Current Status</div>
      <div class="status-row">
        <div class="dot chk" id="dot"></div>
        <div class="status-label" id="msg">Checking…</div>
      </div>
      <div class="sub" id="sub">Pinging mtuaefans.com/api/healthz</div>
    </div>
    <div class="card">
      <div class="card-title">Uptime History — last 90 checks (GitHub Actions)</div>
      <div class="history-grid" id="grid"></div>
      <div class="legend"><span id="oldest">90 checks ago</span><span id="newest">latest</span></div>
      <div class="sub" style="margin-top:.75rem" id="uptime-pct"></div>
    </div>
    <div class="footer">
      Monitored by <a href="https://github.com/Mahmoudterak/dubai-fans-api/actions/workflows/uptime-monitor.yml" target="_blank">GitHub Actions</a>
      · <a href="https://mtuaefans.com" target="_blank">mtuaefans.com</a>
    </div>
    <script>
      const OWNER='Mahmoudterak',REPO='dubai-fans-api',WORKFLOW='uptime-monitor.yml';
      const grid=document.getElementById('grid');
      for(let i=0;i<90;i++){const b=document.createElement('div');b.className='bar';grid.appendChild(b);}
      async function checkLive(){
        const dot=document.getElementById('dot'),msg=document.getElementById('msg'),sub=document.getElementById('sub');
        try{const r=await fetch('https://mtuaefans.com/api/healthz',{cache:'no-store',mode:'cors'});
          dot.className='dot '+(r.ok?'ok':'err');
          msg.textContent=r.ok?'All systems operational':'Service disruption (HTTP '+r.status+')';
          sub.textContent=(r.ok?'Healthy':'Degraded')+' · checked '+new Date().toUTCString();
        }catch{dot.className='dot err';msg.textContent='Service unreachable';sub.textContent='Cannot reach mtuaefans.com · '+new Date().toUTCString();}
      }
      async function loadHistory(){
        try{const res=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/actions/workflows/'+WORKFLOW+'/runs?per_page=90',{headers:{Accept:'application/vnd.github+json'}});
          if(!res.ok)return;const data=await res.json();const runs=(data.workflow_runs||[]).slice(0,90);
          const bars=grid.querySelectorAll('.bar');let ok=0;
          runs.forEach((run,i)=>{const idx=bars.length-1-i;if(idx<0)return;
            const s=run.conclusion==='success';if(s)ok++;
            bars[idx].className='bar '+(s?'ok':'err');
            bars[idx].title=new Date(run.created_at).toUTCString()+' — '+(run.conclusion||run.status);});
          const pct=runs.length?((ok/runs.length)*100).toFixed(1):'—';
          document.getElementById('uptime-pct').textContent=pct+'% uptime across '+runs.length+' checks';
          if(runs.length){document.getElementById('oldest').textContent=new Date(runs[runs.length-1].created_at).toLocaleDateString();
            document.getElementById('newest').textContent=new Date(runs[0].created_at).toLocaleDateString();}
        }catch{}
      }
      checkLive();loadHistory();setInterval(checkLive,60000);
    </script>
    </body>
    </html>
